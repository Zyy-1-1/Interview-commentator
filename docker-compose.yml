# 「面评家」docker compose 编排
# MVP 阶段:仅后端;前端(W3 落地后)追加 frontend 服务
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - db-data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

volumes:
  db-data:
