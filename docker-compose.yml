# 「面评家」docker compose 编排（当前仅后端）
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview-backend
    env_file:
      - ./backend/.env
    environment:
      # 固定到持久卷，避免 .env 中的本地相对路径覆盖容器配置。
      DATABASE_URL: sqlite:////app/data/interview.db
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  db-data:
